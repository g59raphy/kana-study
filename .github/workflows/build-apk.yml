name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          # 시작 화면(스플래시) 생성
          npx @capacitor/assets generate --android --splashBackgroundColor '#faf7f2' --splashBackgroundColorDark '#16161a'
          # 앱 아이콘: 미리 만들어 둔 res/ 를 그대로 덮어씀 (기본 아이콘 제거 후 복사)
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*
          cp -r res/. android/app/src/main/res/
          ls android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-anydpi-v26
          cmp res/mipmap-xxxhdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          # 세로 화면 고정
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          # 업데이트 설치가 되도록 버전 번호 증가
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KS_BASE64" | base64 -d > ks.p12
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --out kana-study.apk aligned.apk
          $BT/apksigner verify kana-study.apk
          rm ks.p12

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 가나 공부 v1.0.${{ github.run_number }}
          make_latest: true
          files: kana-study.apk
          body: |
            안드로이드 휴대폰에서 아래 **kana-study.apk** 를 눌러 내려받아 설치하세요.
            (처음 설치할 때 "출처를 알 수 없는 앱 설치"를 허용해야 할 수 있어요.)
