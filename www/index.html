<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8505b">
<title>하루 니혼고</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#222;--sub:#7a7368;--line:#e8e1d6;--accent:#e8505b;--accent-soft:#fde8ea;--good:#2e9e6a;--good-soft:#e2f4ea;--bad:#d9434f;--bad-soft:#fbe4e6;--guide:#ddd6ca;--grid:#eee7dc}
@media (prefers-color-scheme:dark){:root{--bg:#16161a;--card:#222228;--ink:#eeeeee;--sub:#9a9aa3;--line:#34343c;--accent-soft:#3b2226;--good-soft:#1d3329;--bad-soft:#3b2226;--guide:#45454e;--grid:#2c2c33}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font-family:inherit;cursor:pointer}
.jp{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Meiryo",sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:19px;margin:0;font-weight:800}
header h1 span{color:var(--accent)}
.by{text-align:right;margin-top:18px;font-size:11px;font-weight:600;color:var(--sub);opacity:.8;letter-spacing:.2px}
.seg{display:inline-flex;background:var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:999px;font-size:14px;color:var(--sub);font-weight:700;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.secs{display:flex;gap:8px;margin:0 16px 12px}
.secs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);background:var(--card);color:var(--sub);border-radius:14px;padding:10px 6px;font-size:16px;font-weight:800}
.secs button b{font-size:19px;font-weight:600}
.secs button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
body.sec-word nav{display:none}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
section{display:none}section.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:9px 0 11px;color:var(--sub);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:21px;line-height:1}
nav button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.muted{color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:15px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 32px 10px 12px;font-size:15px;font-weight:700;font-family:inherit;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
h2{font-size:15px;margin:18px 2px 8px;color:var(--sub)}
/* chart */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1/1.08;border:1px solid var(--line);background:var(--card);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0}
.cell.blank{visibility:hidden}
.cell .k{font-size:28px;line-height:1.1;color:var(--ink)}
.cell .r{font-size:11px;color:var(--sub);margin-top:2px}
.cell .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%}
.cell:active{background:var(--accent-soft)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.legend{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--sub)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--c)}
/* quiz */
.qbox{text-align:center;padding:26px 14px 22px}
.qbig{font-size:96px;line-height:1.1;min-height:106px}
.qbig.read{font-size:46px;font-weight:800;padding:22px 0 10px;min-height:106px}
.qbig.read small{display:block;font-size:20px;color:var(--sub);font-weight:600;margin-top:4px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.choice{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:16px 6px;font-size:20px;font-weight:800;min-height:72px}
.choice.kana{font-size:40px;font-weight:400;padding:8px}
.choice small{display:block;font-size:13px;color:var(--sub);font-weight:600}
.choice.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.choice.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.stats{display:flex;justify-content:space-around;margin-top:12px;font-size:13px;color:var(--sub);text-align:center}
.stats b{display:block;font-size:20px;color:var(--ink)}
/* word */
.vbig{font-size:44px;line-height:1.2;min-height:96px;display:flex;flex-direction:column;justify-content:center;word-break:keep-all}
.vbig small{font-size:20px;color:var(--sub);margin-top:4px}
.vbig.mean{font-size:30px;font-weight:800}
.vinfo{font-size:15px;color:var(--sub);margin-top:6px;min-height:20px}
.choice.vm{font-size:16px;padding:12px 6px;word-break:keep-all}
.choice.vj{font-size:22px;font-weight:600;padding:10px 4px}
.choice.vj small{font-size:13px;margin-top:2px}
/* write */
.target{display:flex;align-items:center;gap:12px;margin:12px 0}
.target .tk{font-size:46px;width:62px;text-align:center}
.target .tr{font-size:22px;font-weight:800}
.target .tr small{display:block;font-size:13px;color:var(--sub);font-weight:600}
.pad{position:relative;width:100%;max-width:400px;margin:0 auto;aspect-ratio:1/1;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.pad::before,.pad::after{content:"";position:absolute;pointer-events:none;border:0 dashed var(--grid)}
.pad::before{left:50%;top:0;bottom:0;border-left-width:2px}
.pad::after{top:50%;left:0;right:0;border-top-width:2px}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
#ink{touch-action:none;z-index:2}
.tools{display:flex;gap:8px;margin-top:12px}
.tools .btn{flex:1;padding:12px 6px}
.result{text-align:center;margin-top:12px;min-height:58px}
.result b{font-size:30px;letter-spacing:.04em}
.result .msg{font-size:14px;color:var(--sub);margin-top:2px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));text-align:center;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .big{font-size:120px;line-height:1.15}
.sheet .pair{font-size:15px;color:var(--sub);margin-top:2px}
.sheet .rd{font-size:26px;font-weight:800;margin-top:6px}
.sheet .row{margin-top:18px}
.sheet .row .btn{flex:1}
.update{display:none;align-items:center;gap:10px;margin:0 16px 10px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent)}
.update.on{display:flex}
.update .t{flex:1;font-size:14px;font-weight:700}
.update .t small{display:block;font-weight:500;color:var(--sub);font-size:12px;margin-top:2px}
.update .btn{padding:8px 12px;font-size:14px}
.update .x{border:0;background:none;color:var(--sub);font-size:18px;padding:4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#333;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>하루 <span>니혼고</span></h1>
    <div class="seg" id="scriptSeg">
      <button data-v="h" class="jp">ひらがな</button>
      <button data-v="k" class="jp">カタカナ</button>
    </div>
  </header>
  <div class="secs" id="secSeg">
    <button data-v="kana"><b class="jp">あ</b>하루 가나</button>
    <button data-v="word"><b class="jp">語</b>하루 단어</button>
  </div>

  <div class="update" id="updateBar">
    <div class="t">🎉 새 버전이 있어요 <span id="updVer"></span><small id="updCur"></small></div>
    <button class="btn pri" id="updGo">업데이트</button>
    <button class="x" id="updClose" aria-label="닫기">✕</button>
  </div>

  <main>
    <!-- 표 -->
    <section id="tab-chart">
      <div class="card">
        <div class="row"><b id="progText">학습 0 / 71</b><span class="sp"></span><span class="muted">글자를 누르면 발음·쓰기</span></div>
        <div class="prog"><i id="progBar" style="width:0"></i></div>
        <div class="legend"><span style="--c:var(--good)">잘 알아요</span><span style="--c:#e0a32e">연습 중</span><span style="--c:var(--bad)">자주 틀려요</span></div>
      </div>
      <h2>기본 (청음)</h2>
      <div class="grid" id="gridBasic"></div>
      <h2>탁음 · 반탁음</h2>
      <div class="grid" id="gridDak"></div>
      <div style="text-align:center;margin-top:22px"><button class="btn" id="resetBtn" style="font-size:13px;color:var(--sub)">학습 기록 초기화</button></div>
    </section>

    <!-- 퀴즈 -->
    <section id="tab-quiz">
      <div class="row" style="margin-top:4px">
        <select id="quizSet"></select>
        <span class="sp"></span>
        <div class="seg" id="quizModeSeg">
          <button data-v="k2r"><span class="jp">あ</span>→아</button>
          <button data-v="r2k">아→<span class="jp">あ</span></button>
        </div>
      </div>
      <div class="card qbox" style="margin-top:12px">
        <div id="qPrompt" class="qbig jp"></div>
        <button class="btn" id="qSpeak" style="margin-top:8px;padding:7px 14px;font-size:13px">🔊 듣기</button>
      </div>
      <div class="choices" id="qChoices"></div>
      <div style="margin-top:12px;display:none" id="qNextWrap"><button class="btn pri" id="qNext" style="width:100%">다음 문제 →</button></div>
      <div class="stats">
        <div><b id="sRight">0</b>맞힘</div>
        <div><b id="sWrong">0</b>틀림</div>
        <div><b id="sStreak">0</b>연속 정답</div>
      </div>
    </section>

    <!-- 단어 -->
    <section id="tab-word">
      <div class="row" style="margin-top:4px">
        <select id="wordSet"></select>
        <span class="sp"></span>
        <div class="seg" id="wordModeSeg">
          <button data-v="j2m"><span class="jp">あ</span>→뜻</button>
          <button data-v="m2j">뜻→<span class="jp">あ</span></button>
        </div>
      </div>
      <div class="card" style="margin-top:12px;padding:10px 14px">
        <div class="row"><b id="vProgText" style="font-size:14px"></b><span class="sp"></span><span class="muted">2번 이상 맞히면 외운 단어</span></div>
        <div class="prog"><i id="vProgBar" style="width:0"></i></div>
      </div>
      <div class="card qbox" style="margin-top:12px">
        <div id="vPrompt" class="vbig"></div>
        <div id="vInfo" class="vinfo">&nbsp;</div>
        <button class="btn" id="vSpeak" style="margin-top:8px;padding:7px 14px;font-size:13px">🔊 듣기</button>
      </div>
      <div class="choices" id="vChoices"></div>
      <div style="margin-top:12px;display:none" id="vNextWrap"><button class="btn pri" id="vNext" style="width:100%">다음 문제 →</button></div>
      <div class="stats">
        <div><b id="vRight">0</b>맞힘</div>
        <div><b id="vWrong">0</b>틀림</div>
        <div><b id="vStreak">0</b>연속 정답</div>
      </div>
    </section>

    <!-- 쓰기 -->
    <section id="tab-write">
      <div class="row" style="margin-top:4px">
        <select id="writeSet"></select>
        <span class="sp"></span>
        <div class="seg" id="writeModeSeg">
          <button data-v="trace">따라쓰기</button>
          <button data-v="recall">보고쓰기</button>
        </div>
      </div>
      <div class="target">
        <div class="tk jp" id="wChar"></div>
        <div class="tr" id="wRead"></div>
        <span class="sp"></span>
        <button class="btn" id="wSpeak" style="padding:9px 12px">🔊</button>
      </div>
      <div class="pad" id="pad">
        <canvas id="guide"></canvas>
        <canvas id="ink"></canvas>
      </div>
      <div class="tools">
        <button class="btn" id="wUndo">↶ 한 획</button>
        <button class="btn" id="wClear">지우기</button>
        <button class="btn pri" id="wCheck">채점</button>
      </div>
      <div class="result" id="wResult"><div class="msg">칸 안에 손가락으로 써 보세요</div></div>
      <div class="tools" style="margin-top:4px">
        <button class="btn" id="wPrev">← 이전</button>
        <button class="btn" id="wRand">🔀 랜덤</button>
        <button class="btn" id="wNext">다음 →</button>
      </div>
      <div style="text-align:center;margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="wAuto" style="font-size:13px;padding:8px 14px;border-radius:99px"></button>
        <button class="btn" id="wOrder" style="font-size:13px;padding:8px 14px;border-radius:99px"></button>
      </div>
    </section>
    <div class="by">(made by 도현)</div>
  </main>

  <nav><div class="in">
    <button data-tab="chart"><b>あ</b>오십음도</button>
    <button data-tab="quiz"><b>?</b>퀴즈</button>
    <button data-tab="write"><b>✎</b>쓰기 연습</button>
  </div></nav>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <div class="big jp" id="shBig"></div>
    <div class="rd" id="shRead"></div>
    <div class="pair jp" id="shPair"></div>
    <div class="pair" id="shStat"></div>
    <div class="row">
      <button class="btn" id="shSpeak">🔊 듣기</button>
      <button class="btn pri" id="shWrite">✎ 쓰기 연습</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

{const hb=ITEMS.filter(i=>!i.dak),hs='3222334132312314211243221314143232332222121231',ks='2233323232332223333222241221142322322322213232';

   STROKES[it.h]=STROKES[bh]+add;STROKES[it.k]=STROKES[bk]+add})}

function level(it){
  const s=S.stats[ch(it)];if(!s||(s.c+s.w===0&&!s.ws))return null;
  const n=s.c+s.w,acc=n?s.c/n:1;
  if(n>=3&&acc<0.6)return 'var(--bad)';
  if((n>=3&&acc>=0.8)||s.ws>=70)return 'var(--good)';
  return '#e0a32e';
}
function renderChart(){
  const draw=(el,list)=>{el.innerHTML=list.map((it,i)=>{
    if(!it)return '<div class="cell blank"></div>';
    const c=level(it);
    return `<button class="cell" data-c="${it.h}">${c?`<i class="dot" style="background:${c}"></i>`:''}<span class="k jp">${ch(it)}</span><span class="r">${it.ko} · ${it.ro}</span></button>`;
  }).join('')};
  draw($('#gridBasic'),LAYOUT[0]);draw($('#gridDak'),LAYOUT[1]);
  const learned=ITEMS.filter(it=>level(it)==='var(--good)').length;
  $('#progText').textContent=`잘 아는 글자 ${learned} / ${ITEMS.length}`;
  $('#progBar').style.width=(learned/ITEMS.length*100)+'%';
}

const Q={cur:null,last:null,right:0,wrong:0,streak:0,locked:false};
function weightedPick(pool){
  const ws=pool.map(it=>{const s=S.stats[ch(it)];if(it===Q.last)return 0;if(!s||s.c+s.w===0)return 3;return 1+4*(s.w+1)/(s.c+s.w+2)});
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i]}
  return pool[0];
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function nextQuestion(){
  Q.locked=false;$('#qNextWrap').style.display='none';
  const pool=poolOf(S.quizSet);
  const ans=weightedPick(pool);Q.cur=ans;Q.last=ans;
  // 보기: 같은 행/세트에서 우선, 발음이 겹치지 않게
  const used=new Set([ans.ro]);const opts=[ans];
  for(const src of [shuffle(pool.slice()),shuffle(ITEMS.filter(i=>i.dak===ans.dak)),shuffle(ITEMS.slice())]){
    for(const it of src){if(opts.length>=4)break;if(!used.has(it.ro)){used.add(it.ro);opts.push(it)}}
  }
  shuffle(opts);
  const p=$('#qPrompt');
  if(S.quizMode==='k2r'){p.className='qbig jp';p.textContent=ch(ans)}
  else{p.className='qbig read';p.innerHTML=`${ans.ko}<small>${ans.ro}</small>`}
  $('#qChoices').innerHTML=opts.map(it=>S.quizMode==='k2r'
    ?`<button class="choice" data-c="${it.h}">${it.ko}<small>${it.ro}</small></button>`
    :`<button class="choice kana jp" data-c="${it.h}">${ch(it)}</button>`).join('');
  if(S.quizMode==='r2k')speak(ch(ans));
}
$('#qChoices').addEventListener('click',e=>{

  document.querySelectorAll('.choice').forEach(x=>{if(x.dataset.c===Q.cur.h)x.classList.add('ok')});

  save();

});

function parsePath(d){

    pts.push([u*u*u*x+3*u*u*s*x1+3*u*s*s*x2+s*s*s*x3,u*u*u*y+3*u*u*s*y1+3*u*s*s*y2+s*s*s*y3])}

    else if(C==='C'){cub(n()+ox,n()+oy,n()+ox,n()+oy,n()+ox,n()+oy)}
    else if(C==='S'){const a=2*x-px,b=2*y-py;cub(a,b,n()+ox,n()+oy,n()+ox,n()+oy)}

function strokesBox(st){let a=1,b=1,c=0,d=0;for(const s of st)for(const [x,y] of s){if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y}return [a,b,c,d]}

function glyphBox(c){

const TILTS=[[0,0],...[-20,-15,-10,-5,5,10,15,20].map(d=>[d*Math.PI/180,0]),[0,-0.3],[0,-0.15],[0,0.15],[0,0.3]];

}
// 테두리를 한 겹씩 깎아 획의 중심선 근처만 남김 (원래 픽셀의 25% 아래로는 깎지 않음)
function thin(m,N){
  const total=m.reduce((a,b)=>a+b,0);let cur=m;
  for(let it=0;it<20;it++){
    const nx=new Uint8Array(N*N);let cnt=0;
    for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const i=y*N+x;if(cur[i]&&cur[i-1]&&cur[i+1]&&cur[i-N]&&cur[i+N]){nx[i]=1;cnt++}}
    if(cnt<total*0.25)break;cur=nx;
  }
  return cur;
}
// 모범 글자의 중심선 점들 (가운데 70% 상자에 맞춘 좌표, 글자별로 한 번만 계산)
const CORE={};
function glyphCore(c){
  if(CORE[c])return CORE[c];
  const N=100,g=glyphBox(c),s=0.7/boxSize(g),[gx,gy]=boxMid(g);
  const m=thin(maskOf((x,n)=>{x.save();x.translate(n/2,n/2);x.scale(s,s);x.translate(-gx*n,-gy*n);drawGlyph(x,n,c,'#000');x.restore()},N),N);
  const p=[];for(let i=0;i<N*N;i++)if(m[i])p.push([(i%N+0.5)/N,((i/N|0)+0.5)/N]);
  return CORE[c]=p;
}
function resample(st,step){const out=[];for(const s of st){out.push(s[0]);for(let i=1;i<s.length;i++){const [x0,y0]=s[i-1],[x1,y1]=s[i],d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/step));for(let k=1;k<=n;k++)out.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n])}}return out}
function nearest(A,B){return A.map(([ax,ay])=>{let b=1e9;for(const [bx,by] of B){const d=(ax-bx)*(ax-bx)+(ay-by)*(ay-by);if(d<b)b=d}return Math.sqrt(b)}).sort((a,b)=>a-b)}
function distScore(c,strokes){ // strokes는 이미 가운데 70% 상자로 정규화된 상태
  const U=resample(strokes,0.01),G=glyphCore(c);if(!U.length||!G.length)return 0;
  const a=nearest(U,G),b=nearest(G,U),mean=v=>v.reduce((x,y)=>x+y,0)/v.length,p90=v=>v[Math.floor(v.length*0.9)];
  const e=0.5*Math.max(mean(a),mean(b))+0.5*Math.max(p90(a),p90(b)); // 평균 거리 + 가장 어긋난 부분
  return Math.max(0,Math.min(1,(CAL.d0-e)/CAL.dw))*100;
}
const CAL={d0:0.12,dw:0.08,p0:0.32}; // 채점 기준값 (d0·dw는 작을수록, p0은 클수록 엄격)
function compare(G,Gd,strokes,N,uTol){
  const U =maskOf((x,n)=>drawStrokes(x,n,n*0.05,'#000',strokes),N);
  const Ud=maskOf((x,n)=>drawStrokes(x,n,n*uTol,'#000',strokes),N);
  let u=0,ug=0,g=0,gu=0;
  for(let i=0;i<N*N;i++){if(U[i]){u++;if(Gd[i])ug++}if(G[i]){g++;if(Ud[i])gu++}}
  if(!u||!g)return 0;
  const P=ug/u,R=gu/g;
  return Math.round(Math.max(0,Math.min(1,(P*R-CAL.p0)/0.6))*100);
}
// 5단계 판정 (내부 점수 기준)
const GRADES=[{min:90,name:'EXCELLENT',col:'#d08a00',msg:'완벽해요! 🎉'},{min:70,name:'GREAT',col:'var(--good)',msg:'잘 썼어요 👍'},
  {min:35,name:'GOOD',col:'#3b7ddd',msg:'좋아요!'},{min:20,name:'NOT BAD',col:'#e0a32e',msg:'빨간 글자와 비교해 보세요'},
  {min:-1,name:'TRY AGAIN',col:'var(--bad)',msg:'빨간 글자를 참고해서 다시 써 볼까요?'}];
const gradeOf=sc=>GRADES.find(g=>sc>=g.min);
function setResult(html){$('#wResult').innerHTML=html||`<div class="msg">${S.writeMode==='trace'?'회색 글자를 따라 써 보세요':'발음을 보고 글자를 떠올려 써 보세요'}</div>`}
function doCheck(auto){
  clearTimers();
  if(W.checked)return;
  if(!W.strokes.length){if(!auto)toast('먼저 글자를 써 보세요');return}
  const it=witem(),sc=score(ch(it),W.strokes,S.writeMode==='recall');
  const s=st(ch(it));if(sc>s.ws)s.ws=sc;
  const g=gradeOf(sc),pass=g.name!=='TRY AGAIN';
  if(S.writeMode==='recall'){pass?s.c++:s.w++}
  save();
  W.checked=true;drawGuide();
  const goOn=S.auto!==false&&pass;
  const hint=goOn?'곧 다음 글자로 넘어가요':S.auto!==false&&!pass?'칸을 다시 터치하면 새로 쓸 수 있어요':'';
  setResult(`<b style="color:${g.col}">${g.name}</b><div class="msg">${g.msg}${hint?'<br>'+hint:''}</div>`);
  speak(ch(it));
  if(goOn)nextT=setTimeout(()=>{if(S.tab==='write'&&W.checked)$('#wNext').click()},1400);
}
$('#wCheck').onclick=()=>doCheck(false);
function paintAuto(){const on=S.auto!==false;$('#wAuto').textContent=on?'⚡ 자동 채점·넘기기 켜짐':'자동 채점·넘기기 꺼짐';$('#wAuto').classList.toggle('pri',on)}
$('#wAuto').onclick=()=>{S.auto=S.auto===false;save();paintAuto();clearTimers();toast(S.auto?'다 쓰면 알아서 채점하고, 잘 쓰면 다음 글자로 넘어가요':'채점·다음 버튼을 직접 눌러요')};
paintAuto();
function paintOrder(){const on=S.order!==false;$('#wOrder').textContent=on?'🔢 획순 보기 켜짐':'획순 보기 꺼짐';$('#wOrder').classList.toggle('pri',on);$('#wOrder').style.display=S.writeMode==='trace'?'':'none'}
$('#wOrder').onclick=()=>{S.order=S.order===false;save();paintOrder();drawGuide()};
paintOrder();
$('#wUndo').onclick=()=>{clearTimers();if(W.checked){W.checked=false;drawGuide();setResult()}W.strokes.pop();drawInk()};
$('#wClear').onclick=()=>{clearTimers();W.strokes=[];W.checked=false;drawGuide();drawInk();setResult()};
function loadWrite(keepIdx){
  if(!keepIdx){W.pool=poolOf(S.writeSet);if(W.idx>=W.pool.length||W.idx<0)W.idx=0}
  clearTimers();
  const it=witem();W.strokes=[];W.checked=false;
  const recall=S.writeMode==='recall';
  $('#wChar').textContent=recall?'?':ch(it);
  $('#wRead').innerHTML=`${it.ko} · ${it.ro}<small>${S.script==='h'?'히라가나':'가타카나'} ${W.idx+1} / ${W.pool.length}</small>`;
  drawGuide();drawInk();setResult();
}
$('#wPrev').onclick=()=>{W.idx=(W.idx-1+W.pool.length)%W.pool.length;loadWrite(true)};
$('#wNext').onclick=()=>{W.idx=(W.idx+1)%W.pool.length;loadWrite(true)};
$('#wRand').onclick=()=>{if(W.pool.length>1){let n;do{n=Math.random()*W.pool.length|0}while(n===W.idx);W.idx=n}loadWrite(true)};
$('#wSpeak').onclick=()=>speak(ch(witem()));
fillSelect('#writeSet','writeSet',()=>{W.idx=0;loadWrite()});
bindSeg('#writeModeSeg','writeMode',()=>{paintOrder();loadWrite(true)});

// ---------- 업데이트 확인 (GitHub 최신 릴리스와 앱 버전 비교) ----------
const REPO='g59raphy/kana-study';
let APK_URL=`https://github.com/${REPO}/releases/latest`; // 릴리스 정보를 받으면 실제 APK 주소로 바뀜
const verNum=v=>String(v||'').replace(/^v/,'').split('.').map(n=>parseInt(n,10)||0);
const newer=(a,b)=>{const x=verNum(a),y=verNum(b);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
async function checkUpdate(){
  const app=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
  if(!app)return;                       // 컴퓨터 브라우저에서는 확인하지 않음
  try{
    const {version}=await app.getInfo();
    const r=await fetch(`https://api.github.com/repos/${REPO}/releases/latest`,{headers:{Accept:'application/vnd.github+json'}});
    if(!r.ok)return;
    const rel=await r.json(),latest=rel.tag_name;
    // 파일명에 버전이 들어가므로(kana-study-v1.0.N.apk) 릴리스의 APK 파일 주소를 그대로 사용
    const apk=(rel.assets||[]).find(a=>/^kana-study-v.*\.apk$/.test(a.name))||(rel.assets||[]).find(a=>/\.apk$/.test(a.name));
    if(apk)APK_URL=apk.browser_download_url;
    if(!newer(latest,version)||S.skipVer===latest)return;
    $('#updVer').textContent=latest;
    $('#updCur').textContent=`지금 버전 v${version} · 학습 기록은 그대로 남아요`;
    $('#updateBar').classList.add('on');
    $('#updClose').onclick=()=>{S.skipVer=latest;save();$('#updateBar').classList.remove('on')};
  }catch(e){}                           // 인터넷이 없으면 조용히 넘어감
}
$('#updGo').onclick=()=>{toast('내려받은 뒤 파일을 열어 설치를 눌러 주세요');setTimeout(()=>{location.href=APK_URL},600)};

// ---------- 시작 ----------
loadWrite();
showTab(S.tab);
checkUpdate();
</script>
